<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>IT Pixel Avatar Preview</title>
<style>
  body { background: #12121A; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 40px; font-family: system-ui; color: #F0F0F8; margin: 0; }
  .section { text-align: center; }
  .label { font-size: 12px; color: #7A7A8E; margin-bottom: 12px; }
  .row { display: flex; gap: 24px; align-items: center; justify-content: center; }
  .avatar-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .avatar-circle { border-radius: 50%; border: 1px solid #2A2A3A; display: flex; align-items: center; justify-content: center; background: #1A1A24; }
  .avatar-circle:hover { border-color: #7A7A8E60; }
  .size-label { font-size: 10px; color: #7A7A8E; }
  .comparison { display: flex; gap: 48px; align-items: flex-end; margin-top: 20px; }
  .comp-item { text-align: center; }
  .comp-label { font-size: 11px; color: #A0A0B8; margin-top: 8px; }
  h2 { font-size: 14px; color: #A0A0B8; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }

  /* Light mode preview */
  .light-bg { background: #F5F5F8; border-radius: 12px; padding: 24px 40px; }
  .light-bg .avatar-circle { background: #FFFFFF; border-color: #D0D0D8; }
  .light-bg .size-label { color: #666; }
</style>
</head>
<body>

  <h2>IT Pixel Initials — Avatar Preview</h2>

  <!-- Dark mode sizes -->
  <div class="section">
    <div class="label">Dark Mode — Multiple sizes</div>
    <div class="row">
      <div class="avatar-wrapper">
        <div class="avatar-circle" style="width:28px;height:28px;">
          <svg width="16" height="16" viewBox="0 0 7 7" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="3" height="1" fill="#A0A0B0"/>
            <rect x="1" y="1" width="1" height="1" fill="#9898A8"/>
            <rect x="1" y="2" width="1" height="1" fill="#9090A0"/>
            <rect x="1" y="3" width="1" height="1" fill="#888898"/>
            <rect x="1" y="4" width="1" height="1" fill="#808090"/>
            <rect x="1" y="5" width="1" height="1" fill="#787888"/>
            <rect x="0" y="6" width="3" height="1" fill="#707080"/>
            <rect x="4" y="0" width="3" height="1" fill="#A0A0B0"/>
            <rect x="5" y="1" width="1" height="1" fill="#9898A8"/>
            <rect x="5" y="2" width="1" height="1" fill="#9090A0"/>
            <rect x="5" y="3" width="1" height="1" fill="#888898"/>
            <rect x="5" y="4" width="1" height="1" fill="#808090"/>
            <rect x="5" y="5" width="1" height="1" fill="#787888"/>
            <rect x="5" y="6" width="1" height="1" fill="#707080"/>
          </svg>
        </div>
        <span class="size-label">28px</span>
      </div>
      <div class="avatar-wrapper">
        <div class="avatar-circle" style="width:40px;height:40px;">
          <svg width="24" height="24" viewBox="0 0 7 7" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="3" height="1" fill="#A0A0B0"/>
            <rect x="1" y="1" width="1" height="1" fill="#9898A8"/>
            <rect x="1" y="2" width="1" height="1" fill="#9090A0"/>
            <rect x="1" y="3" width="1" height="1" fill="#888898"/>
            <rect x="1" y="4" width="1" height="1" fill="#808090"/>
            <rect x="1" y="5" width="1" height="1" fill="#787888"/>
            <rect x="0" y="6" width="3" height="1" fill="#707080"/>
            <rect x="4" y="0" width="3" height="1" fill="#A0A0B0"/>
            <rect x="5" y="1" width="1" height="1" fill="#9898A8"/>
            <rect x="5" y="2" width="1" height="1" fill="#9090A0"/>
            <rect x="5" y="3" width="1" height="1" fill="#888898"/>
            <rect x="5" y="4" width="1" height="1" fill="#808090"/>
            <rect x="5" y="5" width="1" height="1" fill="#787888"/>
            <rect x="5" y="6" width="1" height="1" fill="#707080"/>
          </svg>
        </div>
        <span class="size-label">40px (app size)</span>
      </div>
      <div class="avatar-wrapper">
        <div class="avatar-circle" style="width:56px;height:56px;">
          <svg width="36" height="36" viewBox="0 0 7 7" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="3" height="1" fill="#A0A0B0"/>
            <rect x="1" y="1" width="1" height="1" fill="#9898A8"/>
            <rect x="1" y="2" width="1" height="1" fill="#9090A0"/>
            <rect x="1" y="3" width="1" height="1" fill="#888898"/>
            <rect x="1" y="4" width="1" height="1" fill="#808090"/>
            <rect x="1" y="5" width="1" height="1" fill="#787888"/>
            <rect x="0" y="6" width="3" height="1" fill="#707080"/>
            <rect x="4" y="0" width="3" height="1" fill="#A0A0B0"/>
            <rect x="5" y="1" width="1" height="1" fill="#9898A8"/>
            <rect x="5" y="2" width="1" height="1" fill="#9090A0"/>
            <rect x="5" y="3" width="1" height="1" fill="#888898"/>
            <rect x="5" y="4" width="1" height="1" fill="#808090"/>
            <rect x="5" y="5" width="1" height="1" fill="#787888"/>
            <rect x="5" y="6" width="1" height="1" fill="#707080"/>
          </svg>
        </div>
        <span class="size-label">56px</span>
      </div>
      <div class="avatar-wrapper">
        <div class="avatar-circle" style="width:80px;height:80px;">
          <svg width="52" height="52" viewBox="0 0 7 7" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="3" height="1" fill="#A0A0B0"/>
            <rect x="1" y="1" width="1" height="1" fill="#9898A8"/>
            <rect x="1" y="2" width="1" height="1" fill="#9090A0"/>
            <rect x="1" y="3" width="1" height="1" fill="#888898"/>
            <rect x="1" y="4" width="1" height="1" fill="#808090"/>
            <rect x="1" y="5" width="1" height="1" fill="#787888"/>
            <rect x="0" y="6" width="3" height="1" fill="#707080"/>
            <rect x="4" y="0" width="3" height="1" fill="#A0A0B0"/>
            <rect x="5" y="1" width="1" height="1" fill="#9898A8"/>
            <rect x="5" y="2" width="1" height="1" fill="#9090A0"/>
            <rect x="5" y="3" width="1" height="1" fill="#888898"/>
            <rect x="5" y="4" width="1" height="1" fill="#808090"/>
            <rect x="5" y="5" width="1" height="1" fill="#787888"/>
            <rect x="5" y="6" width="1" height="1" fill="#707080"/>
          </svg>
        </div>
        <span class="size-label">80px</span>
      </div>
    </div>
  </div>

  <!-- Light mode -->

    <div class="light-bg">
      <div class="row">

              <rect x="5" y="1" width="1" height="1" fill="#9898A8"/>

              <rect x="5" y="4" width="1" height="1" fill="#808090"/>
              <rect x="5" y="5" width="1" height="1" fill="#787888"/>
              <rect x="5" y="6" width="1" height="1" fill="#707080"/>
            </svg>
          </div>
          <span class="size-label">40px</span>
        </div>
        <div class="avatar-wrapper">
          <div class="avatar-circle" style="width:80px;height:80px;">
            <svg width="52" height="52" viewBox="0 0 7 7" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg">
              <rect x="0" y="0" width="3" height="1" fill="#A0A0B0"/>
              <rect x="1" y="1" width="1" height="1" fill="#9898A8"/>
              <rect x="1" y="2" width="1" height="1" fill="#9090A0"/>
              <rect x="1" y="3" width="1" height="1" fill="#888898"/>
              <rect x="1" y="4" width="1" height="1" fill="#808090"/>
              <rect x="1" y="5" width="1" height="1" fill="#787888"/>
              <rect x="0" y="6" width="3" height="1" fill="#707080"/>
              <rect x="4" y="0" width="3" height="1" fill="#A0A0B0"/>
              <rect x="5" y="1" width="1" height="1" fill="#9898A8"/>
              <rect x="5" y="2" width="1" height="1" fill="#9090A0"/>
              <rect x="5" y="3" width="1" height="1" fill="#888898"/>
              <rect x="5" y="4" width="1" height="1" fill="#808090"/>
              <rect x="5" y="5" width="1" height="1" fill="#787888"/>
              <rect x="5" y="6" width="1" height="1" fill="#707080"/>
            </svg>
          </div>
          <span class="size-label">80px</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Side by side with Cube Coco -->
  <div class="section">
    <div class="label">Comparison — IT initials vs Cube Coco (both at 40px)</div>
    <div class="comparison">
      <div class="comp-item">
        <div class="avatar-circle" style="width:40px;height:40px;">
          <svg width="24" height="24" viewBox="0 0 7 7" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="3" height="1" fill="#A0A0B0"/>

            <rect x="5" y="6" width="1" height="1" fill="#707080"/>

        <div class="comp-label">IT initials</div>

      <div class="comp-item">

    </div>
  </div>

</body>
</html>
